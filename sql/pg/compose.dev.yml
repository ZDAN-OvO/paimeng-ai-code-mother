services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${PAIMENG_PG_ADMIN_PASSWORD:?请设置本地 PostgreSQL 管理员密码}
    ports:
      - "127.0.0.1:${PAIMENG_PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2.11
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PAIMENG_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
