spring:
  # 项目名称
  application:
    name: paimeng-code-mother-backend
  # session 管理配置 - 后端
  session:
    store-type: redis
    timeout: 2592000s
  # PostgreSQL。通过 local 配置或 SPRING_DATASOURCE_* 提供连接参数。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/paimeng_java
    username: paimeng_java
  # redis
  data:
    redis:
      host: localhost
      password:
      port: 6379
      ttl: 3600
      database: 0
  profiles:
    active: local


# 共享工作区。相对子目录以工作区根为基准，也可以单独配置绝对路径。
paimeng:
  agent:
    base-url: "${AGENT_SERVICE_BASE_URL:http://127.0.0.1:8000}"
    internal-token: "${INTERNAL_API_TOKEN:}"
  workspace:
    root: "${PAIMENG_WORKSPACE_ROOT:}"
    code-output-root-dir: code_output
    code-staging-root-dir: code_staging
    code-deploy-root-dir: code_deploy
    screenshot-root-dir: screenshots

# 端口 根路径
server:
  port: 8123
  servlet:
    context-path: /api
    # session 管理配置 - 前端：设置 cookie 过期时间（30天），不设置的话前端不会将 cookie 持久化，关闭浏览器后登录态丢失
    session:
      cookie:
        max-age: 2592000s

# springdoc
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zdan.paimengaicodemother.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
