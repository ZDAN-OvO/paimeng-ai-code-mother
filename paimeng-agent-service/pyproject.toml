[project]
name = "paimeng-agent-service"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "redis>=6,<9",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.26,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["integration: requires dedicated PostgreSQL and Redis test connections"]
