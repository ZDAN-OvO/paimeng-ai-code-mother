name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:syntax
      - run: pnpm test
      - run: pnpm build
      - run: pnpm contract:check

  system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:system
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            test-results/
          retention-days: 3
          if-no-files-found: ignore

  # Stable required-check name. A failed, cancelled, or skipped dependency must fail this gate.
  check:
    if: always()
    needs: [quality, system]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every PR check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          SYSTEM: ${{ needs.system.result }}
        run: test "$QUALITY" = success && test "$SYSTEM" = success
